<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
		>
		<title>$GODOT_PROJECT_NAME</title>
		<style>
:root {
	--safe-left: env(safe-area-inset-left, 0px);
	--safe-top: env(safe-area-inset-top, 0px);
	--safe-right: env(safe-area-inset-right, 0px);
	--safe-bottom: env(safe-area-inset-bottom, 0px);
	--shell-left: max(14px, var(--safe-left));
	--shell-top: max(14px, var(--safe-top));
	--shell-right: max(14px, var(--safe-right));
	--shell-bottom: max(14px, var(--safe-bottom));
}

html, body {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	min-height: 100%;
}

body {
	color: #f7efe0;
	background:
		radial-gradient(circle at 20% 18%, rgba(238, 184, 104, 0.16), transparent 24%),
		radial-gradient(circle at 84% 20%, rgba(114, 177, 214, 0.12), transparent 28%),
		linear-gradient(180deg, #071117 0%, #04090d 100%);
	overflow: hidden;
	touch-action: none;
	overscroll-behavior: none;
	font-family: "Hiragino Sans GB", "Noto Sans CJK SC", "PingFang SC", sans-serif;
}

#shell {
	position: relative;
	display: flex;
	align-items: center;
	justify-content: center;
	width: 100vw;
	width: 100dvw;
	height: 100vh;
	height: 100dvh;
	box-sizing: border-box;
	padding: var(--shell-top) var(--shell-right) var(--shell-bottom) var(--shell-left);
}

#frame {
	position: relative;
	width: min(
		calc(100dvw - var(--shell-left) - var(--shell-right)),
		calc((100dvh - var(--shell-top) - var(--shell-bottom)) * 16 / 9)
	);
	height: min(
		calc((100dvw - var(--shell-left) - var(--shell-right)) * 9 / 16),
		calc(100dvh - var(--shell-top) - var(--shell-bottom))
	);
	max-width: 100%;
	max-height: 100%;
	overflow: hidden;
	border-radius: clamp(16px, 2vw, 28px);
	border: 1px solid rgba(219, 194, 152, 0.18);
	background:
		radial-gradient(circle at 50% 12%, rgba(252, 231, 191, 0.08), transparent 34%),
		linear-gradient(180deg, rgba(10, 20, 26, 0.94), rgba(5, 10, 14, 0.98));
	box-shadow:
		0 28px 90px rgba(0, 0, 0, 0.5),
		inset 0 0 0 1px rgba(114, 177, 214, 0.12);
	backdrop-filter: blur(18px);
}

#frame::before {
	content: "";
	position: absolute;
	inset: 0;
	background:
		linear-gradient(140deg, rgba(247, 220, 176, 0.08), transparent 36%),
		radial-gradient(circle at 75% 18%, rgba(114, 177, 214, 0.12), transparent 30%);
	pointer-events: none;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	background: #03070a;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background: rgba(6, 11, 15, 0.82);
	backdrop-filter: blur(28px);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
	filter: drop-shadow(0 24px 36px rgba(0, 0, 0, 0.35));
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: min(380px, 56%);
	margin: 0 auto;
	accent-color: #ddb56a;
}

#status-notice {
	background-color: rgba(91, 57, 67, 0.92);
	border-radius: 14px;
	border: 1px solid rgba(233, 126, 147, 0.4);
	color: #ede8de;
	line-height: 1.4;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem 1.1rem;
	text-align: center;
	z-index: 1;
}

#web-shell-hud {
	position: fixed;
	top: calc(var(--shell-top) + 10px);
	right: calc(var(--shell-right) + 10px);
	display: flex;
	flex-wrap: wrap;
	gap: 10px;
	justify-content: flex-end;
	z-index: 5;
	pointer-events: none;
}

.web-shell-chip {
	display: none;
	align-items: center;
	justify-content: center;
	min-height: 38px;
	padding: 0 14px;
	border-radius: 999px;
	border: 1px solid rgba(229, 214, 180, 0.16);
	background: rgba(9, 18, 24, 0.78);
	box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
	color: #f5ead6;
	font-size: 13px;
	font-weight: 600;
	letter-spacing: 0.04em;
	backdrop-filter: blur(18px);
	pointer-events: auto;
}

#fullscreen-chip {
	cursor: pointer;
}

body.hanzi-web-fullscreen-available #fullscreen-chip {
	display: inline-flex;
}

body.hanzi-web-portrait #orientation-chip {
	display: inline-flex;
}

body.hanzi-web-short #web-shell-hud {
	top: calc(var(--shell-top) + 8px);
	gap: 8px;
}

body.hanzi-web-short .web-shell-chip {
	min-height: 34px;
	padding: 0 12px;
	font-size: 12px;
}

@supports not (height: 100dvh) {
	#shell {
		width: 100vw;
		height: 100vh;
	}

	#frame {
		width: min(
			calc(100vw - var(--shell-left) - var(--shell-right)),
			calc((100vh - var(--shell-top) - var(--shell-bottom)) * 16 / 9)
		);
		height: min(
			calc((100vw - var(--shell-left) - var(--shell-right)) * 9 / 16),
			calc(100vh - var(--shell-top) - var(--shell-bottom))
		);
	}
}

@media (pointer: coarse) and (orientation: portrait) {
	#frame {
		border-radius: 18px;
	}
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<div id="shell">
			<div id="frame">
				<canvas id="canvas">
					Your browser does not support the canvas tag.
				</canvas>

				<noscript>
					Your browser does not support JavaScript.
				</noscript>

				<div id="status">
					<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
					<progress id="status-progress"></progress>
					<div id="status-notice"></div>
				</div>
			</div>
		</div>

		<div id="web-shell-hud">
			<div id="orientation-chip" class="web-shell-chip">建议横屏体验</div>
			<button id="fullscreen-chip" class="web-shell-chip" type="button">全屏 / Fullscreen</button>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const canvas = document.getElementById('canvas');
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const fullscreenChip = document.getElementById('fullscreen-chip');

	let initializing = true;
	let statusMode = '';

	function canFullscreen() {
		return !!(canvas.requestFullscreen || document.documentElement.requestFullscreen);
	}

	function updateViewportMeta() {
		const viewport = document.querySelector('meta[name="viewport"]');
		if (!viewport) {
			return;
		}
		viewport.setAttribute(
			'content',
			'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content'
		);
	}

	function updateShellState() {
		const width = window.innerWidth || document.documentElement.clientWidth || 0;
		const height = window.innerHeight || document.documentElement.clientHeight || 0;
		const coarsePointer = window.matchMedia('(pointer: coarse)').matches;
		const portrait = coarsePointer && height > width;
		const shortViewport = height < 740;
		const fullscreenActive = !!document.fullscreenElement;
		document.body.classList.toggle('hanzi-web-portrait', portrait);
		document.body.classList.toggle('hanzi-web-short', shortViewport);
		document.body.classList.toggle('hanzi-web-fullscreen-available', canFullscreen() && !fullscreenActive);
		if (fullscreenChip) {
			fullscreenChip.textContent = fullscreenActive ? '退出全屏 / Exit' : '全屏 / Fullscreen';
		}
	}

	function toggleFullscreen() {
		if (document.fullscreenElement && document.exitFullscreen) {
			document.exitFullscreen().catch(() => {});
			return;
		}
		const target = canvas || document.documentElement;
		if (target.requestFullscreen) {
			target.requestFullscreen().catch(() => {
				if (document.documentElement.requestFullscreen) {
					document.documentElement.requestFullscreen().catch(() => {});
				}
			});
		}
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	updateViewportMeta();
	updateShellState();
	window.addEventListener('resize', updateShellState, { passive: true });
	window.addEventListener('orientationchange', () => {
		window.setTimeout(updateShellState, 180);
	}, { passive: true });
	document.addEventListener('fullscreenchange', updateShellState);
	if (fullscreenChip) {
		fullscreenChip.addEventListener('click', toggleFullscreen);
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			updateShellState();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
